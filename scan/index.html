<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>四驱店铺</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#06070D;--panel:#0D1120;--fg:#E6F7FF;--muted:#7F93AD;--line:#1C2A44;--accent:#00EAFF;--mag:#FF2BD6;--ok:#39FF9F;--warn:#FCEE0A;--bad:#FF3B6B;
  --f:"Rajdhani","Noto Sans SC","PingFang SC","Hiragino Sans",system-ui,sans-serif;--disp:"Orbitron",var(--f);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:linear-gradient(rgba(0,234,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.04) 1px,transparent 1px);background-size:28px 28px;color:var(--fg);font-family:var(--f);font-size:16px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-family:var(--disp);font-size:20px;color:var(--accent);text-shadow:0 0 10px rgba(0,234,255,.5);margin:4px 0 2px;letter-spacing:.06em}
.sub{font-size:10px;letter-spacing:.25em;color:var(--mag);margin-bottom:16px}
.card{background:var(--panel);border:1px solid rgba(0,234,255,.3);padding:14px;margin:12px 0;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
button{font:inherit;font-weight:700;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:12px 16px;width:100%;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
button.pri{background:var(--accent);color:#00131A;box-shadow:0 0 14px rgba(0,234,255,.5)}
button.big{font-size:20px;padding:20px}
button:disabled{opacity:.45}
input{font:inherit;font-size:16px;width:100%;background:#070B16;color:var(--fg);border:1px solid var(--line);padding:11px 12px;margin:4px 0 10px}
input:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:14px}
.tag{display:inline-block;border:1px solid currentColor;padding:0 7px;font-size:13px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item img{width:72px;height:72px;object-fit:contain;background:#fff}
.big-img{width:100%;max-height:260px;object-fit:contain;background:#fff}
.num{font-family:var(--disp);color:var(--accent);font-size:22px}
.qty{width:76px;margin:0;text-align:center}
#reader{width:100%;background:#000;margin-top:10px}
.msg{padding:12px;margin:10px 0;border:1px solid}
.msg.ok{border-color:var(--ok);background:rgba(57,255,159,.08)} .msg.bad{border-color:var(--bad);background:rgba(255,59,107,.1)} .msg.warn{border-color:var(--warn);background:rgba(252,238,10,.08)}
[hidden]{display:none!important}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,17,32,.97);border-top:1px solid rgba(0,234,255,.35);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabs button{flex:1;border:0;clip-path:none;background:none;color:var(--muted);padding:8px 0 10px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button span{font-size:20px}
.tabs button.on{color:var(--accent);text-shadow:0 0 8px rgba(0,234,255,.6)}
.tabs i{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:60;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 8px;padding-bottom:2px}
.chips button{width:auto;flex:none;padding:6px 12px;font-size:14px;border-color:var(--line);color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:12px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-family:var(--disp);font-size:22px;color:var(--accent);margin-top:2px} .kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.act{border-color:var(--warn)} .kpi.act .v{color:var(--warn)} .kpi.bad{border-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.bars b{display:block;width:100%;background:linear-gradient(var(--accent),rgba(0,234,255,.25));min-height:2px}
.row2{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 img{width:56px;height:56px;object-fit:contain;background:#fff}
.row2 .n{font-size:15px;line-height:1.25} .row2 .m{font-size:12.5px;color:var(--muted)} .row2 .r{text-align:right;font-size:13px}
</style>
</head>
<body>
<h1>四驱店铺</h1>
<div class="sub">MINI4WD // SHOP OS · MOBILE · <span id="ver"></span></div>

<div id="login" class="card" hidden>
  <b>登录</b><p class="muted">用你在 Supabase 建的那个账号（邮箱 + 密码）。登录一次，以后打开就不用再登。</p>
  <label class="muted" for="em">邮箱</label><input id="em" type="email" autocomplete="username">
  <label class="muted" for="pw">密码</label><input id="pw" type="password" autocomplete="current-password">
  <button class="pri" id="loginBtn">登录</button>
  <div id="loginMsg"></div>
</div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between;margin:-6px 0 6px"><span class="muted" id="upd">读取中…</span><button id="refBtn" style="width:auto;padding:6px 12px">↻ 刷新</button></div>
  <section id="tHome"></section>
  <section id="tProd" hidden>
    <input id="pq" placeholder="搜 SKU / 中文名 / 日文名" type="search">
    <div class="chips" id="pchips"></div><div id="plist"></div></section>
  <section id="tList" hidden>
    <input id="lq" placeholder="搜上新商品（中文名 / 日文 / SKU）" type="search">
    <div class="chips" id="lchips"></div><div id="llist"></div></section>
  <section id="tOrd" hidden><div class="chips" id="ochips"></div><div id="olist"></div></section>
  <section id="tScan" hidden>
    <button class="pri big" id="scanBtn">📷 扫码</button>
    <div id="reader" hidden></div>
    <div class="row" style="margin-top:10px"><input id="manual" placeholder="扫不出来：手动输入 SKU" style="margin:0"><button id="goBtn" style="width:90px">查看</button></div>
    <p class="muted">扫电脑屏幕上的二维码：<b>进货单</b> → 对着货逐个入库；<b>订单</b> → 打包核对、标记已发货；<b>商品</b> → 看库存。原来的条形码也能扫。</p>
    <p class="muted" style="margin-top:30px"><a href="#" id="logout" style="color:var(--muted)">退出登录</a></p></section>
  <nav class="tabs">
    <button data-tab="tHome" class="on"><span>📊</span>概况</button><button data-tab="tProd"><span>📦</span>商品</button><button data-tab="tList"><span>🏷️</span>上新</button>
    <button data-tab="tOrd"><span>🧾</span>订单<i id="obadge" hidden></i></button><button data-tab="tScan"><span>📷</span>扫码</button></nav>
</div>
<div id="sheet" hidden><button id="back" style="width:auto;padding:8px 14px;margin-bottom:8px">← 返回</button><div id="view"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const SUPABASE_URL = 'https://omiwwwfruwpgtivtzxna.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TJb3F7opoaO3g_TikVYQjg_0JHan-lx';  // 公开用的钥匙；没登录什么都读不到
const IMG = 'https://raw.githubusercontent.com/vermouther1986/images-store/main/images/';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = sku => IMG + encodeURIComponent(sku) + '.jpg';
const msg = (cls, text) => `<div class="msg ${cls}">${text}</div>`;
const name = s => esc(String(s || '').split(' / ').slice(0, 2).join(' / '));
const t = s => s ? new Date(s).toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '';
function buzz() { try { navigator.vibrate && navigator.vibrate(80); } catch {} }

async function boot() {
  const {data} = await sb.auth.getSession();
  $('#login').hidden = !!data.session; $('#app').hidden = !data.session;
  if (data.session && !D) load();
  // 用手机相机直接扫电脑上的码，会带着 #PB:12 这样的尾巴打开这个页面
  if (data.session && location.hash.length > 1) {
    const code = decodeURIComponent(location.hash.slice(1));
    history.replaceState(null, '', location.pathname);
    handle(code);
  }
}
$('#loginBtn').onclick = async () => {
  $('#loginBtn').disabled = true;
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim(), password: $('#pw').value});
  $('#loginBtn').disabled = false;
  if (error) { $('#loginMsg').innerHTML = msg('bad', '登录失败：邮箱或密码不对'); return; }
  boot();
};
$('#logout').onclick = async e => { e.preventDefault(); await sb.auth.signOut(); boot(); };

// ───────── 扫码 ─────────
let scanner = null;
$('#scanBtn').onclick = async () => {
  if (scanner) { await stopScan(); return; }
  $('#reader').hidden = false; $('#scanBtn').textContent = '停止扫码';
  scanner = new Html5Qrcode('reader', {formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128]});
  try {
    await scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: {width: 260, height: 260}}, async text => { buzz(); await stopScan(); handle(text); });
  } catch (e) { await stopScan(); $('#view').innerHTML = msg('bad', '打不开摄像头：请在浏览器里允许使用相机。也可以在下面手动输入 SKU。'); }
};
async function stopScan() {
  if (scanner) { try { await scanner.stop(); } catch {} try { scanner.clear(); } catch {} }
  scanner = null; $('#reader').hidden = true; $('#scanBtn').textContent = '📷 扫码';
}
$('#goBtn').onclick = () => handle($('#manual').value);

function handle(text) {
  openSheet();
  text = String(text || '').trim();
  const h = text.indexOf('#');  // 新二维码是网址：…/scan/#PB:12
  if (/^https?:\/\//i.test(text) && h >= 0) text = decodeURIComponent(text.slice(h + 1));
  if (text.startsWith('PB:')) return showBatch(text.slice(3));
  if (text.startsWith('OR:')) return showOrder(text.slice(3));
  if (/^[A-Z0-9]+-\d{6}$/i.test(text)) return showProduct(text.toUpperCase());
  $('#view').innerHTML = msg('warn', `看不懂这个码：${esc(text)}<br>请扫店铺软件里显示的二维码，或商品的条形码。`);
}
async function q(p) { const {data, error} = await p; if (error) throw new Error(error.message); return data; }

// ───────── 进货单：逐个入库 ─────────
async function showBatch(id) {
  $('#view').innerHTML = '<p class="muted">读取进货单…</p>';
  try {
    const b = await q(sb.from('purchase_batches').select('*, purchase_items(id, sku, qty, received_qty, products(cn_name, ja_name))').eq('id', id).single());
    const items = b.purchase_items.sort((x, y) => x.sku.localeCompare(y.sku));
    const left = items.filter(i => i.received_qty < i.qty).length;
    $('#view').innerHTML = `<div class="card"><b>进货单 ${esc(b.batch_date)}</b> ${b.counted ? '' : '<span class="tag warn">盘点前（不计库存）</span>'}
      <div class="muted">${esc(b.title)} · ${items.length} 种 · 还有 ${left} 种没入库</div>
      ${items.map(i => `<div class="item"><img src="${img(i.sku)}" alt="">
        <div><div>${name(i.products?.cn_name)}</div><div class="muted">${esc(i.sku)}</div>
        <div>应到 <b>${i.qty}</b> · 已到 <b class="${i.received_qty >= i.qty ? 'ok' : 'warn'}">${i.received_qty}</b></div>
        ${b.counted && i.received_qty < i.qty ? `<div class="row" style="margin-top:6px">这次到 <input class="qty" type="number" inputmode="numeric" min="1" max="${i.qty - i.received_qty}" value="${i.qty - i.received_qty}" id="n_${i.id}"> 件
          <button class="pri" style="width:auto;padding:10px 14px" data-rcv="${i.id}" data-cur="${i.received_qty}" data-max="${i.qty}">✓ 入库</button></div>`
          : (b.counted ? '<span class="tag ok">已入库</span>' : '')}</div></div>`).join('')}</div>`;
    document.querySelectorAll('[data-rcv]').forEach(btn => btn.onclick = () => receive(btn, id));
  } catch (e) { $('#view').innerHTML = msg('bad', '找不到这个进货单：' + esc(e.message)); }
}
async function receive(btn, batchId) {
  const cur = Number(btn.dataset.cur), max = Number(btn.dataset.max), n = Number($('#n_' + btn.dataset.rcv).value);
  if (!(n > 0) || cur + n > max) { alert(`这次最多入库 ${max - cur} 件`); return; }
  btn.disabled = true;
  // 只在「已到数量还是我看到的那个数」时才改：别的设备刚入过库，就不会重复加
  const rows = await q(sb.from('purchase_items').update({received_qty: cur + n}).eq('id', btn.dataset.rcv).eq('received_qty', cur).select());
  if (!rows.length) alert('这一行刚刚被别的设备改过，已重新读取，请再看一下');
  buzz(); showBatch(batchId);
}

// ───────── 订单：打包核对、标记已发货 ─────────
async function showOrder(id) {
  $('#view').innerHTML = '<p class="muted">读取订单…</p>';
  try {
    const o = await q(sb.from('orders').select('*, order_lines(sku, qty, products(cn_name, ja_name))').eq('id', id).single());
    const head = {'待发货': msg('warn', '待发货：对着下面的图核对商品和件数，没问题就点「标记已发货」。库存已经在收到邮件时扣过了，这里不会再扣。'),
      '已发货': msg('ok', `已经发过货了（${t(o.shipped_at)}）。不用再处理，也不会重复扣库存。`),
      '待确认': o.order_lines.length ? '' : (quickPick(o) || '') + `<div id="pkBox"></div>`,
      '已撤销': msg('bad', '这单已经撤销（煤炉取消或记错），不要发货。')}[o.status] || '';
    $('#view').innerHTML = `<div class="card"><b>${esc(o.mercari_item_id || '手动出库')}</b><div class="muted">${esc(o.title)}</div>${head}
      ${o.order_lines.map(l => `<div class="item"><img src="${img(l.sku)}" alt=""><div><div>${name(l.products?.cn_name)}</div>
        <div class="muted">${esc(l.sku)}</div><div class="num">× ${l.qty}</div></div></div>`).join('')}
      ${o.status === '待发货' ? '<button class="pri big" id="shipBtn" style="margin-top:14px">✓ 核对无误，标记已发货</button>' : ''}
      ${o.counted && ['待发货', '已发货'].includes(o.status) ? '<button id="cancelBtn" style="margin-top:14px;border-color:var(--bad);color:var(--bad)">撤销这张订单（库存加回）</button>' : ''}</div>`;
    if ($('#cancelBtn')) $('#cancelBtn').onclick = async () => {  // 和电脑一样：改成「已撤销」，数据库自动把库存加回（原记录保留）
      if (!confirm('撤销这张订单？\n库存会加回（写一条「撤销」记录，原记录保留）。\n一般只有煤炉取消交易、或者记错了才需要撤销。')) return;
      $('#cancelBtn').disabled = true;
      try {
        await q(sb.from('orders').update({status: '已撤销', note: '在手机上撤销，库存已加回'}).eq('id', id).in('status', ['待发货', '已发货']));
        buzz(); showOrder(id);
      } catch (e) { alert('没撤销成功：' + e.message); $('#cancelBtn').disabled = false; }
    };
    if ($('#pkBox')) phonePicker(o);
    bindPick(id);
    if ($('#shipBtn')) $('#shipBtn').onclick = async () => {
      $('#shipBtn').disabled = true;
      await q(sb.from('orders').update({status: '已发货', shipped_at: new Date().toISOString()}).eq('id', id).eq('status', '待发货'));
      buzz(); showOrder(id);
    };
  } catch (e) { $('#view').innerHTML = msg('bad', '找不到这张订单：' + esc(e.message)); }
}
// 手机：合买截图 → 云端排队 → 电脑上的 AI 认出几件 → 这里显示，点确认才扣库存
function shrinkImg(file) {
  return new Promise((ok, bad) => {
    const im = new Image(); im.onerror = () => bad(new Error('图片打不开'));
    im.onload = () => { const s = Math.min(1, 1600 / im.width), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); ok(c.toDataURL('image/jpeg', 0.85)); };
    im.src = URL.createObjectURL(file);
  });
}
function matomePhone(o) {
  const shots = [];
  $('#mtFile').onchange = async e => {
    for (const f of [...e.target.files].slice(0, 8 - shots.length)) { const d = await shrinkImg(f); shots.push(d); $('#mtPrev').insertAdjacentHTML('beforeend', `<img src="${d}" style="height:80px">`); }
    $('#mtGo').disabled = !shots.length;
  };
  $('#mtGo').onclick = async () => {
    $('#mtGo').disabled = true; $('#mtOut').innerHTML = msg('warn', pcOn() ? '已发给电脑，AI 正在看截图…' : '已排队：电脑没开，开机后会处理（1 小时内）');
    try {
      const [r] = await q(sb.from('ai_requests').insert({kind: 'matome', order_id: o.id, images: shots}).select('id'));
      for (let i = 0; i < 120; i++) {
        await new Promise(res => setTimeout(res, 3000));
        if (!$('#mtOut')) return;
        const [x] = await q(sb.from('ai_requests').select('status,result,error').eq('id', r.id));
        if (x.status === '处理中') $('#mtOut').innerHTML = msg('warn', 'AI 正在认…');
        if (x.status === '失败') { $('#mtOut').innerHTML = msg('bad', '没认成：' + esc(x.error)); $('#mtGo').disabled = false; return; }
        if (x.status === '完成') {
          const R = x.result, cf = c => `<span class="tag ${c === '高' ? 'ok' : c === '中' ? 'warn' : 'bad'}">${esc(c)}</span>`;
          R.items.forEach(i => { i.choices = i.choices && i.choices.length ? i.choices : [{listing_sku: i.listing_sku, cn: i.cn, parts: partsOf(i.listing_sku).map(p => [p.b, p.n])}]; i.pick = 0; });
          const unsure = i => i.choices.length > 1 && !i.tapped;
          const lines = () => { const m = {}; R.items.forEach(i => i.choices[i.pick].parts.forEach(([b, n]) => m[b] = (m[b] || 0) + n * i.count)); return Object.entries(m).map(([sku, qty]) => ({sku, qty})); };
          const draw = () => {
            const L = lines(), left = R.items.filter(unsure).length, warn = (R.warn || []).filter(w => !/把握不大/.test(w));
            $('#mtOut').innerHTML = R.items.map((it, k) => { const c = it.choices[it.pick]; return `<div class="item"><img src="${img(partsOf(c.listing_sku)[0].b)}" alt=""><div style="flex:1">
                <div>${it.tapped ? '<span class="tag ok">你选的</span>' : cf(it.confidence)} ${full(c.cn || c.listing_sku)} ×${it.count}</div>
                ${it.choices.length > 1 ? `<div style="margin:6px 0">${unsure(it) ? '<div class="warn" style="font-size:13px">是哪个？点一下：</div>' : ''}${it.choices.map((x, n) => `<button data-ch="${k}:${n}" class="${n === it.pick && it.tapped ? 'pri' : ''}" style="width:auto;padding:6px 10px;margin:3px 4px 0 0;font-size:14px">${full((x.cn || x.listing_sku).split(' / ')[0])}${x.price ? ' ¥' + x.price : ''}</button>`).join('')}</div>` : ''}
                <div class="muted" style="font-size:12px">截图里：${esc(it.seen_title)}</div></div></div>`; }).join('')
              + (warn.length ? msg('bad', '⚠ ' + warn.map(esc).join('<br>⚠ ')) : '')
              + (L.length ? (left ? `<button disabled style="margin-top:8px">还有 ${left} 件要点一下选</button>`

let LF = '待上架';

// 老资料（从上新表搬来的）栏目名是中文，新保存的是英文 → 统一成英文
const LAB = {'中文名': 'cn', '日文商品名(核心词)': 'ja', '单价RMB': 'cost_rmb', '每单进货数量': 'qty', '成本JPY(日元进货时手填)': 'cost_jpy_in', '数量表示': 'qty_text'};
const F_ = l => { if (!l._f) { l._f = {}; for (const [k, v] of Object.entries(l.fields || {})) { const e = LAB[k] || k; if (v !== '' && v != null) l._f[e] = v; else if (!(e in l._f)) l._f[e] = v; } } return l._f; };
function lCost(l) {  // 和电脑上的公式一样：成本 = 单价RMB × 汇率 × 件数（组合按各件相加）；日元进价优先
  const f = F_(l);
  if (fnum(f.cost_jpy_in) != null) return fnum(f.cost_jpy_in);
  let rmb = fnum(f.cost_rmb);
  if (rmb == null && /[+*]/.test(l.listing_sku)) {
    rmb = 0;
    for (const p of partsOf(l.listing_sku)) {
      const one = fnum(D.L[p.b] ? F_(D.L[p.b]).cost_rmb : null) ?? (D.P[p.b]?.unit_price_rmb != null ? D.P[p.b].unit_price_rmb * 1.06 : null);
      if (one == null) return null; rmb += one * p.n;
    }
  }
  return rmb == null ? null : Math.round(rmb * D.rate * Math.max(1, fnum(f.qty) || 1));

  $('#view').innerHTML = `<div class="card"><img class="big-img" src="${lImg(l)}" onerror="${lImgFb(l)}" alt="">
      <div style="margin-top:8px;font-size:18px">${lName(l)}</div><div class="muted">${esc(sku)} · 可卖 ${stock} ${/[+*]/.test(sku) ? '套' : '件'}</div>
      <div class="row" style="margin-top:8px;justify-content:space-between"><span class="tag ${l.status === '已上架' ? 'ok' : 'warn'}">${esc(l.status)}</span>
        <span><span class="num">${yen(l.price_jpy)}</span>${pf ? `　<span class="${pf.m < .35 ? 'warn' : 'ok'}">赚 ${yen(pf.p)}（${(pf.m * 100).toFixed(0)}%）</span>` : ''}</span></div></div>
    ${lSold(l) ? msg('warn', `🛒 <b>${t(l.last_sold_at)} 卖出了</b>（旧链接 <a href="https://jp.mercari.com/item/${esc(l.last_sold_mid)}" target="_blank" rel="noopener" style="color:inherit">${esc(l.last_sold_mid)}</a>），已自动改回「待上架」。<br>
      ${stock > 0 ? `还有 ${stock} ${/[+*]/.test(sku) ? '套' : '件'}：在煤炉 App「再出品」，复制新商品的链接，贴到下面。` : '库存 0：补货后再上架。'}`) : ''}
    ${lPaused(l) ? `<div class="card" style="border-color:var(--warn)"><b class="warn">⏸ ${t(l.paused_at)} 买家合买，煤炉把这件自动「公開停止」了</b>
      <div style="font-size:14px;margin:6px 0">库存已按合买单（${esc(l.paused_mid)}）扣掉。${stock > 0 ? `还有 <b>${stock}</b> ${/[+*]/.test(sku) ? '套' : '件'}：${l.mercari_item_id ? '点下面「在煤炉打开这个商品」' : '在煤炉 App 找到这件'}，点「公開する」重新公开（链接不变）。` : '库存 0：在煤炉上保持停止就行。'}</div>
      <button class="pri" id="unpause">✅ ${stock > 0 ? '已重新公开' : '知道了'}</button></div>` : ''}
    <div class="card"><b>📋 煤炉商品链接</b> <span class="muted" style="font-size:13px">贴上后自动变「已上架」</span>
      <input id="midIn" value="${esc(l.mercari_item_id || '')}" placeholder="在煤炉 App 点「共有」→ 复制链接，贴到这里" style="margin:8px 0 6px">
      <button class="pri" id="midSave">保存链接</button><div id="midMsg"></div></div>
    <div class="card"><b>💬 买家留言 → AI 写日语回复</b>
      <div class="muted" style="font-size:13px;margin:4px 0">把买家的留言或讲价贴进来，AI 按这个商品的保本价、保底价写回复。由电脑上的店铺软件代跑：${pcOn() ? '<span class="ok">电脑在线 ✓</span>' : '<span class="bad">电脑现在没开（开了以后 1 小时内发的会自动处理）</span>'}</div>
      <textarea id="aiMsg" rows="3" placeholder="例：800円にお値下げ可能でしょうか？" style="width:100%;font:inherit;font-size:16px;background:#070B16;color:var(--fg);border:1px solid var(--line);padding:10px;margin:4px 0 8px"></textarea>
      <button class="pri" id="aiGo">💬 生成回复（约 30 秒）</button><div id="aiOut"></div></div>
    <div class="card"><b>讲价试算</b> <span class="muted" style="font-size:13px">输入对方出的价</span>
      <div class="row" style="margin-top:8px"><input id="tryP" type="number" inputmode="numeric" value="${l.price_jpy || ''}" style="margin:0;font-size:22px;font-weight:700"><span>円</span></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">${[-100, -50, -10, 10, 50].map(d => `<button data-d="${d}" style="width:auto;flex:1;padding:8px 0">${d > 0 ? '+' : ''}${d}</button>`).join('')}</div>
      <div id="tryOut" style="margin-top:10px;font-size:16px"></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><b>标题</b><button id="cpT" style="width:auto;padding:6px 12px">复制标题</button></div>
      <div style="margin-top:6px;user-select:text">${esc(lTitle(l))}</div><div class="muted" style="font-size:12.5px">${[...lTitle(l)].length} / 40 字</div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><b>商品说明</b><button id="cpD" style="width:auto;padding:6px 12px">复制说明</button></div>
      <div style="margin-top:6px;white-space:pre-wrap;font-size:14px;user-select:text;max-height:260px;overflow:auto">${esc(l.description || '')}</div></div>
    ${l.mercari_item_id ? `<a href="https://jp.mercari.com/item/${esc(l.mercari_item_id)}" target="_blank" rel="noopener"><button>在煤炉打开这个商品 ↗</button></a>` : ''}
    <!-- 链接框和 AI 回复在上面 -->
    <div class="card"><b>上架状态</b><div class="row" style="margin-top:8px">${['待上架', '已上架', '停售'].map(s => `<button data-st="${s}" class="${s === l.status ? 'pri' : ''}" style="flex:1">${s}</button>`).join('')}</div>
      <p class="muted" style="font-size:12.5px">改价格、标题、出图请在电脑上改。</p></div>`;
  const tryDraw = () => {
    const v = +$('#tryP').value, r = lProfit(l, v);
    $('#tryOut').innerHTML = !r ? '<span class="muted">缺成本，算不了</span>' : `到手 <b>${yen(Math.floor(v * (1 - D.fee)))}</b>　利润 <b class="${r.p < 0 ? 'bad' : r.m < .35 ? 'warn' : 'ok'}" style="font-size:22px">${r.p < 0 ? '−' : ''}${yen(Math.abs(r.p))}</b>　<b class="${r.p < 0 ? 'bad' : r.m < .35 ? 'warn' : 'ok'}">${(r.m * 100).toFixed(1)}%</b>
      <div class="muted" style="font-size:13px;margin-top:4px">${r.p < 0 ? '⚠ 亏本' : r.m < .35 ? '比保底利润 35% 低' : '可以接受'} · 保本价 ${yen(Math.ceil(r.total / (1 - D.fee)))}</div>`;
  };
  $('#tryP').oninput = tryDraw;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { $('#tryP').value = Math.max(0, (+$('#tryP').value || 0) + +b.dataset.d); tryDraw(); });
  tryDraw();
  if ($('#unpause')) $('#unpause').onclick = async () => {
    try { await q(sb.from('listings').update({paused_mid: null, paused_at: null}).eq('listing_sku', sku)); l.paused_mid = l.paused_at = null; buzz(); showListing(sku); }
    catch (e) { alert('没保存：' + e.message); }
  };
  $('#midSave').onclick = async () => {
    const m = ($('#midIn').value.match(/m\d{8,}/) || [])[0];
    if (!m) { $('#midMsg').innerHTML = msg('bad', '没找到商品ID：链接里应该有 m 开头的一串数字'); return; }
    try {
      await q(sb.from('listings').update({mercari_item_id: m, status: '已上架', updated_at: new Date().toISOString()}).eq('listing_sku', sku));
      l.mercari_item_id = m; l.status = '已上架'; buzz(); showListing(sku);
    } catch (e) { $('#midMsg').innerHTML = msg('bad', /duplicate|unique/i.test(e.message) ? '这个链接已经填在别的商品上了' : '没保存：' + esc(e.message)); }
  };
  $('#aiGo').onclick = async () => {
    const text = $('#aiMsg').value.trim();
    if (!text) { $('#aiOut').innerHTML = msg('bad', '先把买家的留言贴进来'); return; }
    $('#aiGo').disabled = true; $('#aiOut').innerHTML = msg('warn', pcOn() ? '已发给电脑，AI 正在写…' : '已排队：电脑没开，开机后会处理');
    try {
      const [r] = await q(sb.from('ai_requests').insert({kind: 'reply', listing_sku: sku, message: text.slice(0, 2000)}).select('id'));
      for (let i = 0; i < 100; i++) {  // 最多等 5 分钟
        await new Promise(res => setTimeout(res, 3000));
        if (!$('#aiOut')) return;  // 离开了这个页面
        const [x] = await q(sb.from('ai_requests').select('status,result,error').eq('id', r.id));
        if (x.status === '处理中') $('#aiOut').innerHTML = msg('warn', 'AI 正在写…');
        if (x.status === '失败') { $('#aiOut').innerHTML = msg('bad', '没写成：' + esc(x.error)); break; }
        if (x.status === '完成') {
          const R = x.result;
          $('#aiOut').innerHTML = `<div style="margin-top:10px"><span class="tag ${R.decision === '接受' ? 'ok' : R.decision === '婉拒' ? 'bad' : 'warn'}">${esc(R.decision)}</span>${R.offer_price ? ` <b>${yen(R.offer_price)}</b>` : ''}
            <div style="white-space:pre-wrap;margin:8px 0;padding:10px;border:1px solid var(--accent);user-select:text">${esc(R.reply_ja)}</div>
            <button class="pri" id="aiCp">复制日语回复</button>
            <div class="muted" style="margin-top:8px;font-size:14px">意思：${esc(R.meaning_zh)}</div><div style="margin-top:4px;font-size:14px">💡 ${esc(R.note_zh)}</div></div>`;
          $('#aiCp').onclick = () => copyText(R.reply_ja, '日语回复');
          break;
        }
      }
    } catch (e) { $('#aiOut').innerHTML = msg('bad', '没发出去：' + esc(e.message)); }
    finally { if ($('#aiGo')) $('#aiGo').disabled = false; }
  };
  $('#cpT').onclick = () => copyText(lTitle(l), '标题');
  $('#cpD').onclick = () => copyText(l.description || '', '商品说明');
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    if (b.dataset.st === l.status) return;
    if (!confirm(`改成「${b.dataset.st}」？`)) return;
    try { await q(sb.from('listings').update({status: b.dataset.st, updated_at: new Date().toISOString()}).eq('listing_sku', sku));
      l.status = b.dataset.st; buzz(); showListing(sku); } catch (e) { alert('没改成：' + e.message); }
  });
}

const valid = o => o.status !== '已撤销' && o.status !== '待确认';
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth() + 1}-${x.getDate()}`; };
function profitOf(o) {
  const cost = (o.order_lines || []).reduce((a, l) => a + (D.P[l.sku]?.unit_price_rmb || 0) * 1.06 * D.rate * l.qty, 0);
  return (o.price_jpy || 0) * (1 - D.fee) - D.ship - cost;
}
const full = s => esc(String(s || '').replace(/\s*\/\s*/g, ' / '));  // 完整中文名（同款不同规格要能分开）
const pname = sku => full(D.P[sku]?.cn_name || sku);

function drawHome() {
  const now = new Date(), today = dayKey(now), mon = `${now.getFullYear()}-${now.getMonth()}`;
  const ok = D.ords.filter(valid);
  const sum = list => ({n: list.length, rev: list.reduce((a, o) => a + (o.price_jpy || 0), 0), pf: list.reduce((a, o) => a + profitOf(o), 0)});
  const tD = sum(ok.filter(o => dayKey(o.sold_at) === today));
  const tM = sum(ok.filter(o => { const d = new Date(o.sold_at); return `${d.getFullYear()}-${d.getMonth()}` === mon; }));
  const c1 = D.ords.filter(o => o.counted && o.status === '待确认').length, c2 = D.ords.filter(o => o.counted && o.status === '待发货').length;
  const days = [...Array(7)].map((_, i) => { const d = new Date(now); d.setDate(d.getDate() - 6 + i); return d; });
  const per = days.map(d => ok.filter(o => dayKey(o.sold_at) === dayKey(d)).reduce((a, o) => a + (o.price_jpy || 0), 0));
  const mx = Math.max(1, ...per);
  const listed = s => (D.L[s]?.status === '已上架');
  const out = D.stock.filter(p => p.stock <= 0 && (listed(p.sku) || (D.way[p.sku] || 0) === 0)).slice(0, 12);
  const low = D.stock.filter(p => p.alert_level > 0 && p.stock > 0 && p.stock <= p.alert_level);
  const top = {}; ok.filter(o => { const d = new Date(o.sold_at); return `${d.getFullYear()}-${d.getMonth()}` === mon; })
    .forEach(o => o.order_lines.forEach(l => top[l.sku] = (top[l.sku] || 0) + l.qty));
  const tops = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const totalStock = D.stock.reduce((a, p) => a + Math.max(0, p.stock), 0);
  $('#tHome').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">今天卖出</div><div class="v">${tD.n} 单</div><div class="s">${yen(tD.rev)} · 利润约 ${yen(tD.pf)}</div></div>
      <div class="kpi"><div class="l">本月卖出</div><div class="v">${tM.n} 单</div><div class="s">${yen(tM.rev)} · 利润约 ${yen(tM.pf)}</div></div>
      <div class="kpi ${c2 ? 'act' : ''}" data-go="待发货"><div class="l">待发货</div><div class="v">${c2}</div><div class="s">${c2 ? '点这里看 →' : '都发完了 ✓'}</div></div>
      <div class="kpi ${c1 ? 'bad' : ''}" data-go="待确认"><div class="l">待确认（认不出的商品）</div><div class="v">${c1}</div><div class="s">${c1 ? '点这里，看图选商品 →' : '没有 ✓'}</div></div>
    </div>
    ${(() => { const rs = Object.values(D.L).filter(l => (lSold(l) || lPaused(l)) && lStock(l.listing_sku) > 0)
        .sort((a, b) => String(b.paused_at || b.last_sold_at).localeCompare(String(a.paused_at || a.last_sold_at)));
      return rs.length ? `<div class="card" style="border:2px solid var(--bad)"><b class="bad">🔔 ${rs.length} 个卖出了、还有库存，要重新上架</b>
        ${rs.map(l => `<div class="row" data-rl="${esc(l.listing_sku)}" style="padding:7px 0;justify-content:space-between;border-bottom:1px solid var(--line)"><span>${lName(l)}
          <div class="muted" style="font-size:12.5px">${md(l.paused_at || l.last_sold_at)} ${lPaused(l) ? '合买被公開停止 → 点「公開する」' : '卖出 → 再出品、贴新链接'}</div></span><b>剩 ${lStock(l.listing_sku)} ›</b></div>`).join('')}</div>` : ''; })()}
    ${D.trend ? `<div class="card" id="trCard"><div class="row" style="justify-content:space-between"><b>🔥 圈子趋势周报</b><span class="muted">${esc(D.trend.date)}</span></div>
      <div style="font-size:14px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden">${esc(D.trend.result.summary_zh)}</div>
      <button style="margin-top:8px">看完整周报 →</button></div>` : ''}
    <div class="card"><b>最近 7 天销售额</b>${per.some(v => v) ? '' : '<span class="muted">　这 7 天还没有卖出</span>'}
      <div class="bars">${per.map((v, i) => `<div><span style="font-size:10.5px;color:var(--fg)">${v ? Math.round(v / 100) / 10 + 'k' : ''}</span><b style="height:${Math.round(v / mx * 80)}%"></b>${days[i].getMonth() + 1}/${days[i].getDate()}</div>`).join('')}</div></div>
    <div class="card"><b>库存</b> <span class="muted">${D.stock.length} 种 · 共 ${totalStock} 件 · 在途 ${Object.values(D.way).reduce((a, b) => a + Math.max(0, b), 0)} 件</span>
      ${out.length ? `<div style="margin-top:8px" class="bad">缺货 ${out.length} 种：</div>${out.map(p => `<div class="muted" data-sku="${esc(p.sku)}" style="padding:3px 0">・${full(p.cn_name)}${D.way[p.sku] ? `（在途 ${D.way[p.sku]}）` : ''}</div>`).join('')}` : '<div class="ok" style="margin-top:6px">没有缺货 ✓</div>'}
      ${low.length ? `<div style="margin-top:8px" class="warn">低库存：</div>${low.map(p => `<div class="muted" data-sku="${esc(p.sku)}" style="padding:3px 0">・${full(p.cn_name)}　剩 ${p.stock}</div>`).join('')}` : ''}</div>
    <div class="card"><b>本月卖得最多</b>${tops.length ? tops.map(([s, n], i) => `<div class="row" data-sku="${esc(s)}" style="padding:5px 0;justify-content:space-between"><span>${i + 1}. ${pname(s)}</span><b>${n} 件</b></div>`).join('') : '<div class="muted">本月还没卖出</div>'}</div>
    <p class="muted" style="font-size:12.5px">📧 煤炉邮件最后同步：${D.mail ? esc(D.mail) + '（每 5 分钟一次，电脑关着也照跑）' : '还没开启即时同步'}</p>
    <p class="muted" style="font-size:12.5px">利润是估算：成交价 − 手续费${Math.round(D.fee * 100)}% − 运费包装${D.ship}円 − 进价。</p>`;
  if ($('#trCard')) $('#trCard').onclick = showTrend;
  document.querySelectorAll('#tHome [data-go]').forEach(e => e.onclick = () => { OF = e.dataset.go; drawOrd(); tab('tOrd'); });
  document.querySelectorAll('#tHome [data-sku]').forEach(e => e.onclick = () => showProduct(e.dataset.sku));
  document.querySelectorAll('#tHome [data-rl]').forEach(e => e.onclick = () => showListing(e.dataset.rl));
}

// 🔥 趋势周报（电脑上每周出一期，同步到云端）
function showTrend() {
  openSheet();
  const T = D.trend, R = T.result;
  const pic = src => src ? `<img loading="lazy" src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<span></span>';
  const it = (src, html) => `<div class="row2" style="grid-template-columns:56px 1fr">${pic(src)}<div style="font-size:14px">${html}</div></div>`;
  const pr = p => `<span class="tag ${p === '高' ? 'ok' : p === '中' ? 'warn' : ''}">${esc(p)}</span>`;
  const sec = (title, arr, f) => (arr || []).length ? `<div class="card"><b>${title}</b>${arr.map(f).join('')}</div>` : '';
  const lk = u => `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;word-break:break-all">${esc(u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40))}</a>`;
  $('#view').innerHTML = `<div class="card"><b>🔥 圈子趋势周报</b> <span class="muted">${esc(T.at || T.date)} · 查了 ${T.searches || 0} 次</span>
      <div style="margin-top:8px;font-size:15px">${esc(R.summary_zh)}</div></div>
    ${sec('🛒 选货建议', R.buy, b => it(b.img, `${pr(b.priority)} <b>${esc(b.item_zh)}</b>${b.supplier_item ? `<div class="muted">供应商有：${esc(b.supplier_item)}${b.supplier_price_rmb ? ` · ¥${b.supplier_price_rmb}` : ''}</div>` : '<div class="muted">价格单里没有</div>'}<div>${esc(b.reason_zh)}</div>`))}
    ${sec('🔥 最近热门', R.hot_items, h => it(h.img, `${pr(h.heat)} <b>${esc(h.name_ja)}</b>（${esc(h.name_zh)}）<div>${esc(h.why_zh)}</div>${(h.sources || []).slice(0, 2).map(lk).join('<br>')}`))}
    ${sec('🏷 新叫法', R.terms, x => `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><b>${esc(x.term)}</b>：${esc(x.meaning_zh)}<div class="muted">${esc(x.advice_zh)}</div></div>`)}
    ${sec('🛠 玩法', R.styles, x => `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><b>${esc(x.name)}</b>：${esc(x.desc_zh)}${x.parts_zh ? `<div class="muted">要用到：${esc(x.parts_zh)}</div>` : ''}</div>`)}
    ${sec('🎨 配色', R.colors, c => `<div style="padding:3px 0;font-size:14px">・${esc(c)}</div>`)}
    ${sec('📢 田宫新品 / 比赛', R.tamiya, x => it(x.img, `<b>${esc(x.title)}</b> <span class="muted">${esc(x.date)}</span><div>${esc(x.impact_zh)}</div>`))}
    ${sec('📈 你卖得好的', R.my_hot, x => it(img(x.sku.split(/[+*]/)[0]), `<span class="muted">${esc(x.sku)}</span> ${esc(x.comment_zh)}`))}
    ${sec('📉 可能在过气', R.fading, x => it(img(x.sku.split(/[+*]/)[0]), `<span class="muted">${esc(x.sku)}</span> ${esc(x.reason_zh)}`))}
    ${sec('✏ 标题可以加的词', R.title_fixes, x => it(img(x.sku.split(/[+*]/)[0]), `<span class="muted">${esc(x.sku)}</span> 加「<b>${esc(x.word)}</b>」：${esc(x.reason_zh)}`))}
    <p class="muted" style="font-size:12.5px">报告是电脑上的店铺软件每周自动出的，只作参考；进货前点来源确认。</p>`;
}

function drawProd() {
  const k = ($('#pq').value || '').trim().toLowerCase();
  const F = {'全部': () => true, '有货': p => p.stock > 0, '缺货': p => p.stock <= 0, '在途': p => (D.way[p.sku] || 0) > 0,
             '已上架': p => D.L[p.sku]?.status === '已上架', '待上架': p => D.L[p.sku]?.status === '待上架'};
  $('#pchips').innerHTML = Object.keys(F).map(f => `<button class="${f === PF ? 'on' : ''}" data-pf="${f}">${f} ${D.stock.filter(F[f]).length}</button>`).join('');
  const list = D.stock.filter(F[PF]).filter(p => !k || `${p.sku} ${p.cn_name} ${p.ja_name}`.toLowerCase().includes(k))
    .sort((a, b) => a.sku.localeCompare(b.sku));
  $('#plist').innerHTML = list.map(p => { const l = D.L[p.sku] || {}; return `<div class="row2" data-sku="${esc(p.sku)}"><img loading="lazy" src="${img(p.sku)}" alt="">
    <div><div class="n">${full(p.cn_name)}</div><div class="m">${esc(p.sku)}${l.status ? ' · ' + esc(l.status) : ''}</div></div>
    <div class="r"><div class="num" style="font-size:20px;color:${p.stock <= 0 ? 'var(--bad)' : 'var(--accent)'}">${p.stock}</div><div class="m">${D.way[p.sku] ? '在途 ' + D.way[p.sku] : '件'}</div><div>${l.price_jpy ? yen(l.price_jpy) : ''}</div></div></div>`; }).join('')
    || '<p class="muted">没有符合的商品</p>';
  document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { PF = b.dataset.pf; drawProd(); });
  document.querySelectorAll('#plist [data-sku]').forEach(e => e.onclick = () => showProduct(e.dataset.sku));
}
$('#pq').oninput = () => D && drawProd();

function drawOrd() {
  const F = {'需要处理': o => o.counted && (o.status === '待确认' || o.status === '待发货'), '待发货': o => o.status === '待发货', '待确认': o => o.status === '待确认',
             '已发货': o => o.status === '已发货', '全部': () => true};
  $('#ochips').innerHTML = Object.keys(F).map(f => `<button class="${f === OF ? 'on' : ''}" data-of="${f}">${f} ${D.ords.filter(F[f]).length}</button>`).join('');
  const list = D.ords.filter(F[OF]).slice(0, 150);
  $('#olist').innerHTML = list.map(o => `<div class="row2" data-or="${o.id}" style="grid-template-columns:56px 1fr auto">
    <img loading="lazy" src="${o.order_lines[0] ? img(o.order_lines[0].sku) : ''}" alt="">
    <div><div class="n">${o.order_lines.map(l => pname(l.sku) + (l.qty > 1 ? ` ×${l.qty}` : '')).join('、') || esc(o.title)}</div>
      <div class="m">${t(o.sold_at)} · ${esc(o.mercari_item_id || o.source)}</div></div>
    <div class="r"><span class="tag ${STAG[o.status] || ''}">${esc(o.status)}</span><div style="margin-top:4px">${yen(o.price_jpy)}</div>${o.counted ? '' : '<div class="m">盘点前</div>'}</div></div>`).join('')
    || `<p class="muted">${OF === '需要处理' ? '没有要处理的订单 ✓' : '没有订单'}</p>`;
  document.querySelectorAll('[data-of]').forEach(b => b.onclick = () => { OF = b.dataset.of; drawOrd(); });
  document.querySelectorAll('#olist [data-or]').forEach(e => e.onclick = () => showOrder(e.dataset.or));
}

function tab(id) {
  document.querySelectorAll('#app > section').forEach(s => s.hidden = s.id !== id);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab(b.dataset.tab); if (b.dataset.tab !== 'tScan') stopScan(); });
$('#refBtn').onclick = load;
setInterval(() => { if (!document.hidden && !$('#app').hidden && $('#sheet').hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').hidden) load(); });

// 自动更新：手机会把网页存一份旧的；打开时去网上看有没有新版本，有就马上换成新的
const VERSION = '2026-11-26c';
$('#ver').textContent = '版本 ' + VERSION;
(async () => {
  try {
    const txt = await (await fetch(location.pathname + '?check=' + Date.now(), {cache: 'no-store'})).text();
    const v = (txt.match(/const VERSION = '([^']+)'/) || [])[1];
    if (v && v !== VERSION && !location.search.includes('v=' + v)) location.replace(location.pathname + '?v=' + v + location.hash);
  } catch {}
})();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  try {
    const txt = await (await fetch(location.pathname + '?check=' + Date.now(), {cache: 'no-store'})).text();
    const v = (txt.match(/const VERSION = '([^']+)'/) || [])[1];
    if (v && v !== VERSION && !location.search.includes('v=' + v)) location.replace(location.pathname + '?v=' + v);
  } catch {}
});

window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
